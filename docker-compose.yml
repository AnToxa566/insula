services:
  postgres:
    image: postgres:17-alpine
    container_name: insula-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: insula
      POSTGRES_PASSWORD: insula
      POSTGRES_DB: insula
    ports:
      - '5432:5432'
    volumes:
      - insula-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U insula']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: insula-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - insula-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  insula-pgdata:
  insula-redisdata:
